<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" width="100%" height="100%">
  <!-- Background: Monokai Pro Ristretto (#2c2525) -->
  <rect width="1600" height="300" rx="32" fill="#2c2525"/>
  <rect x="2" y="2" width="1596" height="296" rx="30" fill="none" stroke="#403e41" stroke-width="2"/>

  <!-- Left: Shield Icon (Centered vertically at y=150, scaled) -->
  <g transform="translate(60, 45)">
    <!-- Base container -->
    <rect width="210" height="210" rx="48" fill="#211b1b" stroke="#403e41" stroke-width="2"/>

    <!-- Scaled Shield Body -->
    <g transform="translate(105, 105) scale(0.42) translate(-256, -256)">
      <path d="M 256 96 L 396 148 C 396 270 336 376 256 420 C 176 376 116 270 116 148 Z"
            fill="#2c2525" stroke="#fd6883" stroke-width="16" stroke-linejoin="round"/>
      <path d="M 210 216 L 254 256 L 210 296"
            fill="none" stroke="#f9cc6c" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="276" y1="296" x2="318" y2="296"
            stroke="#85dacc" stroke-width="18" stroke-linecap="round"/>
      <circle cx="256" cy="96" r="8" fill="#adda78"/>
    </g>
  </g>

  <!-- Divider Line in Monokai selection/split (#5b5353) -->
  <line x1="320" y1="55" x2="320" y2="245" stroke="#5b5353" stroke-width="2"/>

  <!-- Right: Typography & Brand -->
  <g transform="translate(370, 0)">
    <!-- Brand Title: it's.fw -->
    <text x="0" y="152"
          font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace"
          font-size="112" font-weight="700">
      <tspan fill="#fff1f3">it</tspan><tspan fill="#fd6883">'s</tspan><tspan fill="#fff1f3">.</tspan><tspan fill="#f9cc6c">fw</tspan>
    </text>

    <!-- Subtitle: Monokai Muted (#72696a) and Mint Cyan Tag (#85dacc) -->
    <text x="4" y="212"
          font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace"
          font-size="22" font-weight="500" letter-spacing="5px"
          fill="#72696a">
      ZERO-TRUST TERMINAL FIREWALL <tspan fill="#5b5353">│</tspan> <tspan fill="#85dacc">WINDOWS WFP</tspan>
    </text>
  </g>
</svg>
