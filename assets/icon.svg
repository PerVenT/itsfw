<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: Monokai Pro Ristretto deep dark -->
  <rect width="512" height="512" rx="112" fill="#211b1b"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#403e41" stroke-width="3"/>

  <!-- Minimalist Shield Outline in Monokai Red (#fd6883) -->
  <path d="M 256 96 L 396 148 C 396 270 336 376 256 420 C 176 376 116 270 116 148 Z"
        fill="#2c2525" stroke="#fd6883" stroke-width="14" stroke-linejoin="round"/>

  <!-- Inner Soft Accent Accent Line in Warm Orange (#f38d70) -->
  <path d="M 256 126 L 366 166 C 366 260 320 344 256 382 C 192 344 146 260 146 166 Z"
        fill="none" stroke="#f38d70" stroke-width="4" stroke-linejoin="round" opacity="0.35"/>

  <!-- Terminal Prompt `>` in Monokai Yellow (#f9cc6c) -->
  <path d="M 210 216 L 254 256 L 210 296"
        fill="none" stroke="#f9cc6c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Terminal Cursor `_` in Monokai Mint Cyan (#85dacc) -->
  <line x1="276" y1="296" x2="318" y2="296"
        stroke="#85dacc" stroke-width="16" stroke-linecap="round"/>

  <!-- Small Top Shield Notch Point in Monokai Green (#adda78) -->
  <circle cx="256" cy="96" r="6" fill="#adda78"/>
</svg>
